options:
  minimumXcodeGenVersion: 15.0
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
    tvOS: "16.0"
    macOS: "14.0"
packages:
 LiveViewNative:
   url: "https://github.com/liveview-native/liveview-client-swiftui"
   branch: "0.4.0-rc.0"
 ZipFoundation:
   url: "https://github.com/weichsel/ZIPFoundation"
   from: "0.0.1"
  LiveViewNativeBleClient:
    url: "https://github.com/adiibanez/liveview-native-swiftui-bleclient"
    from: "0.0.1"
settings:
  GENERATE_INFOPLIST_FILE: YES
  CURRENT_PROJECT_VERSION: 1.0
  INFOPLIST_KEY_CFBundleDisplayName: SensoctoAppErlang
  INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sensocto.SensoctoAppErlang
  INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
  INFOPLIST_KEY_UILaunchScreen_Generation: YES
  INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "BLEClient"
  INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "BLEClient"
  INFOPLIST_KEY_UIBackgroundModes:
    - "bluetooth-central"
    - "remote-notification"
    - "bluetooth-peripheral"
    - "processing"
    - "external-accessory"
    - "location"
    - "fetch"
    - "workout-processing"
    - "nearby-interaction"
  INFOPLIST_KEY_CFBundleURLTypes:
    - "sensocto"  
  INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
    - "com.sensocto.SensoctoAppErlang.periodicTask"
    
#  CFBundleURLTypes:
#    - CFBundleTypeRole: Editor
#      CFBundleURLName: "Sensocto url scheme"  # Added quotes for string
#      CFBundleURLSchemes:
#        - "sensocto"
  


  #GENERATE_INFOPLIST_FILE: YES
  MARKETING_VERSION: 1.0
  DEAD_CODE_STRIPPING: YES
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  MACOSX_DEPLOYMENT_TARGET: 14.0
  CMAKE_OSX_DEPLOYMENT_TARGET: 14.0
  #CODE_SIGNING_REQUIRED: YES
  
